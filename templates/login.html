<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log in · Timetable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background: #F3F5F8; font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-card { background:#fff; border:1px solid #DFE4ED; border-left:3px solid #B8873A; border-radius:10px; padding:2.5rem; width:100%; max-width:380px; }
    h1 { font-family:'Source Serif 4', serif; font-size:1.5rem; color:#16233F; margin-bottom:.25rem; }
    .btn-primary { background:#B8873A; border-color:#B8873A; color:#241A0C; font-weight:600; }
    .btn-primary:hover { background:#96692A; border-color:#96692A; color:#fff; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Timetable</h1>
    <p class="text-muted mb-4">Sign in to manage your institution's schedule.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" name="username" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</body>
</html>
