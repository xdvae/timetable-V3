{% extends "base.html" %}
{% block title %}Programs{% endblock %}
{% block content %}
<h3 class="mb-3">Programs</h3>
<div class="row">
  <div class="col-md-4">
    <div class="card p-3">
      <h6>Add program</h6>
      <form method="post">
        <div class="mb-2">
          <label class="form-label">Name</label>
          <input class="form-control" name="name" required placeholder="e.g. BCA, Btech CSE, MCA">
        </div>
        <div class="mb-2">
          <label class="form-label">Department</label>
          <input class="form-control" name="department">
        </div>
        <button class="btn btn-primary w-100">Add Program</button>
      </form>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card p-3">
      <table class="table table-sm table-hover">
        <thead><tr><th>Name</th><th>Department</th><th></th></tr></thead>
        <tbody>
        {% for p in programs %}
          <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.department }}</td>
            <td>
              <form method="post" action="{{ url_for('delete_program', pid=p.id) }}" onsubmit="return confirm('Delete this program?');">
                <button class="btn btn-sm btn-outline-danger">Delete</button>
              </form>
            </td>
          </tr>
        {% else %}
          <tr><td colspan="3" class="text-muted">No programs yet.</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
